<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <h1>
            e-commerce store
        </h1>

        <nav>
            <!-- auth.js -->
        </nav>

    </header>


    <main>

        <section
            id="productDetails"
            class="product-details"
        >

            <p>
                Loading product...
            </p>

        </section>

    </main>


    <script src="js/auth.js"></script>


    <script>

        const API_URL =
            "http://localhost:3000/api/products";


        const params =
            new URLSearchParams(
                window.location.search
            );


        const productId =
            params.get("id");


        async function loadProduct() {

            const productDetails =
                document.getElementById(
                    "productDetails"
                );


            if (!productId) {

                productDetails.innerHTML = `
                    <p>
                        Product ID missing.
                    </p>
                `;

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/${productId}`
                    );


                const product =
                    await response.json();


                if (!response.ok) {

                    productDetails.innerHTML = `
                        <p>
                            ${
                                product.message ||
                                "Product not found"
                            }
                        </p>
                    `;

                    return;
                }


                productDetails.innerHTML = `

                    <div
                        class="product-detail-image"
                    >

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                    </div>


                    <div
                        class="product-detail-info"
                    >

                        <p class="category">
                            ${product.category}
                        </p>


                        <h2>
                            ${product.name}
                        </h2>


                        <p class="price">
                            ₹${product.price}
                        </p>


                        <p class="description">
                            ${product.description}
                        </p>


                        <p>
                            ${
                                product.stock > 0
                                ? `Available Stock: ${product.stock}`
                                : "Out of stock"
                            }
                        </p>


                        ${
                            product.stock > 0
                            ? `

                                <div
                                    class="quantity-box"
                                >

                                    <label>
                                        Quantity:
                                    </label>

                                    <input
                                        type="number"
                                        id="quantity"
                                        value="1"
                                        min="1"
                                        max="${product.stock}"
                                    >

                                </div>


                                <button
                                    class="add-cart-btn"
                                    onclick="addToCart()"
                                >
                                    Add to Cart 🛒
                                </button>

                            `
                            :
                            `
                                <button disabled>
                                    Out of Stock
                                </button>
                            `
                        }

                    </div>

                `;


                window.currentProduct =
                    product;


            } catch (error) {

                console.log(error);

                productDetails.innerHTML = `
                    <p>
                        Unable to connect to server.
                    </p>
                `;
            }
        }


        function addToCart() {

            const product =
                window.currentProduct;


            const quantity =
                Number(
                    document.getElementById(
                        "quantity"
                    ).value
                );


            if (!product) {
                return;
            }


            if (
                quantity < 1 ||
                quantity > product.stock
            ) {

                alert(
                    "Invalid quantity"
                );

                return;
            }


            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            const existingProduct =
                cart.find(
                    item =>
                        item.product._id ===
                        product._id
                );


            if (existingProduct) {

                const newQuantity =
                    existingProduct.quantity +
                    quantity;


                if (
                    newQuantity >
                    product.stock
                ) {

                    alert(
                        "Not enough stock available"
                    );

                    return;
                }


                existingProduct.quantity =
                    newQuantity;

            } else {

                cart.push({

                    product: product,

                    quantity: quantity

                });
            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            alert(
                "Product added to cart!"
            );


            window.location.href =
                "cart.html";
        }


        loadProduct();

    </script>

</body>

</html>
