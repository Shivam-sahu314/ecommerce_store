<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <h1>
            e-commerce store
        </h1>

        <nav>
            <!-- auth.js -->
        </nav>

    </header>


    <main>

        <section class="auth-container">

            <div class="auth-box">

                <h2>
                    Login
                </h2>

                <p class="auth-subtitle">
                    Login to your account
                </p>


                <form id="loginForm">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Login
                    </button>


                    <p
                        id="loginMessage"
                        class="auth-message"
                    ></p>

                </form>


                <p class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>


    <script>

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "loginEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "loginPassword"
                    ).value;


                const message =
                    document.getElementById(
                        "loginMessage"
                    );


                if (!email || !password) {

                    message.textContent =
                        "Please fill all fields.";

                    return;
                }


                try {

                    const response =
                        await fetch(
"http://localhost:3000/api/auth/login"  ,                    
      {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message ||
                            "Login failed.";

                        return;
                    }


                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    localStorage.setItem(
                        "user",
                        JSON.stringify(
                            data.user
                        )
                    );


                    message.textContent =
                        "Login successful!";


                    if (
                        data.user.role ===
                        "admin"
                    ) {

                        window.location.href =
                            "admin.html";

                    } else {

                        window.location.href =
                            "index.html";
                    }

                } catch (error) {

                    console.log(error);

                    message.textContent =
                        "Unable to connect to server.";
                }

            }
        );

    </script>

</body>

</html>
