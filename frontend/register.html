<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <link rel="icon" type="image/png" href="./favicon.png">

</head>

<body>

    <header>

        <h1>
            e-commerce store
        </h1>

        <nav>
            <!-- auth.js -->
        </nav>

    </header>


    <main>

        <section class="auth-container">

            <div class="auth-box">

                <h2>
                    Create Account
                </h2>

                <p class="auth-subtitle">
                    Register a new account
                </p>


                <form id="registerForm">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >


                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Enter password"
                        required
                    >


                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Register
                    </button>


                    <p
                        id="registerMessage"
                        class="auth-message"
                    ></p>

                </form>


                <p class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>


    <script>

        const registerForm =
            document.getElementById(
                "registerForm"
            );


        registerForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "registerName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "registerEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "registerPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                const message =
                    document.getElementById(
                        "registerMessage"
                    );


                if (
                    !name ||
                    !email ||
                    !password ||
                    !confirmPassword
                ) {

                    message.textContent =
                        "Please fill all fields.";

                    return;
                }


                if (password.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                try {

                    const response =
                        await fetch(
"http://localhost:3000/api/auth/register" ,                           {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name,
                                        email,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message ||
                            "Registration failed.";

                        return;
                    }


                    alert(
                        "Registration successful! Please login."
                    );


                    window.location.href =
                        "login.html";


                } catch (error) {

                    console.log(error);

                    message.textContent =
                        "Unable to connect to server.";
                }

            }
        );

    </script>

</body>

</html>
